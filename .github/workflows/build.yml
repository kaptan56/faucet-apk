name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Eski Karışık Dosyaları Temizle
        run: |
          rm -rf app
          rm -rf lib
          rm -f build.gradle.kts settings.gradle.kts gradlew gradle.properties

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Projesi Oluştur
        run: flutter create --project-name faucet_app .

      - name: Kodu ve Ayarları Doğru Yere Yaz
        run: |
          echo "" | base64 -d > lib/main.dart
          
          echo "" | base64 -d > pubspec.yaml

      - name: Bağımlılıkları Yükle
        run: flutter pub get

      - name: İnternet İzni Ekle
        run: sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: APK Derle
        run: flutter build apk --release

      - name: APK'yı Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
